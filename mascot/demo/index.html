<title>Byte Playground</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;700;800;900&display=swap">
<style>
  /* Tokens are Career Quest's own (hackathon-lovable-prompt §2 + dark §A). */
  :root {
    --bg: #ffffff; --fg: #4b4b4b; --muted-fg: #777777; --muted: #f7f7f7; --border: #e5e5e5;
    --stage: #f2f3fb; --bubble: #ffffff; --bubble-border: #e5e5e5;
    --green: #58cc02; --green-lip: #46a302; --blue: #1cb0f6; --blue-soft: #ddf4ff; --blue-border: #84d8ff;
    --selected-fg: #1899d6; --code-bg: #f7f7f7;
    --byte-shadow: #dfe1ee; --byte-backdrop: transparent;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --bg: #131f24; --fg: #f1f7fb; --muted-fg: #8ba1ab; --muted: #202f36; --border: #37464f;
      --stage: #1b2a31; --bubble: #202f36; --bubble-border: #37464f;
      --blue-soft: #1b2d36; --blue-border: #1899d6; --selected-fg: #49c0f8; --code-bg: #202f36;
      --byte-shadow: #0d1518; --byte-backdrop: #263840;
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --bg: #131f24; --fg: #f1f7fb; --muted-fg: #8ba1ab; --muted: #202f36; --border: #37464f;
    --stage: #1b2a31; --bubble: #202f36; --bubble-border: #37464f;
    --blue-soft: #1b2d36; --blue-border: #1899d6; --selected-fg: #49c0f8; --code-bg: #202f36;
      --byte-shadow: #0d1518; --byte-backdrop: #263840;
  }

  body {
    background: var(--bg); color: var(--fg);
    font: 500 17px/24px "Nunito", ui-rounded, system-ui, sans-serif;
    padding: 32px 20px 64px;
  }
  #root { max-width: 1040px; margin: 0 auto; display: grid; grid-template-columns: minmax(0, 1fr); gap: 40px; }
  h1, h2 { font-weight: 800; text-wrap: balance; margin: 0; }
  h1 { font-size: 32px; line-height: 40px; }
  h2 { font-size: 24px; line-height: 32px; }
  .sub, .note { color: var(--muted-fg); margin: 6px 0 0; max-width: 65ch; }
  code { font: 700 14px/20px ui-monospace, "SF Mono", Menlo, monospace; background: var(--code-bg); padding: 2px 6px; border-radius: 6px; }
  .eyebrow { font-size: 13px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: var(--muted-fg); }

  .stage-wrap { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr); gap: 24px; align-items: stretch; }
  .stage {
    background: var(--stage); border-radius: 16px; min-height: 420px;
    display: flex; flex-direction: column; align-items: center; justify-content: flex-end; gap: 12px;
    padding: 28px 20px 36px;
  }
  .bubble {
    position: relative; overflow-wrap: anywhere; background: var(--bubble); border: 2px solid var(--bubble-border); border-radius: 16px;
    padding: 12px 16px; font-weight: 700; max-width: 34ch; text-align: center; min-height: 52px;
  }
  .bubble::after {
    content: ""; position: absolute; left: 50%; bottom: -9px; width: 14px; height: 14px; translate: -50% 0; rotate: 45deg;
    background: var(--bubble); border-right: 2px solid var(--bubble-border); border-bottom: 2px solid var(--bubble-border);
  }

  .controls { display: flex; flex-direction: column; gap: 20px; }
  .now code { overflow-wrap: anywhere; }
  .now { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; }
  .now .eyebrow { width: 100%; }
  .chip { font-size: 13px; font-weight: 800; padding: 2px 10px; border-radius: 999px; border: 2px solid var(--border); }
  .chip.rig { border-color: var(--green); color: var(--green); }
  .chip.pose { color: var(--muted-fg); }

  .chunky {
    height: 50px; border-radius: 12px; padding: 0 16px; border: 0; cursor: pointer;
    font: 800 15px/1 "Nunito", system-ui, sans-serif; text-transform: uppercase; letter-spacing: .04em;
    transition: transform .1s, box-shadow .1s;
  }
  .chunky.green { background: var(--green); color: #fff; box-shadow: 0 4px 0 var(--green-lip); }
  .chunky:hover { filter: brightness(1.05); }
  .chunky:active { transform: translateY(4px); box-shadow: 0 0 0 var(--green-lip); }

  .group { display: grid; gap: 10px; }
  .moods { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
  .moods .mood:last-child:nth-child(3n + 1) { grid-column: 1 / -1; }
  .mood {
    font: 700 15px/1.2 "Nunito", system-ui, sans-serif; color: var(--fg); background: transparent;
    border: 2px solid var(--border); border-bottom-width: 4px; border-radius: 12px; padding: 10px 8px; cursor: pointer;
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  }
  .mood:active { transform: translateY(2px); border-bottom-width: 2px; }
  .mood.on { background: var(--blue-soft); border-color: var(--blue-border); color: var(--selected-fg); }
  button:focus-visible { outline: 3px solid var(--blue); outline-offset: 2px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--green); display: inline-block; }

  .sheet { display: grid; gap: 12px; }
  .sheet-head { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; }
  .sheet-head .mood { padding: 8px 14px; }
  .grid { display: grid; gap: 12px; }
  .grid.faces { grid-template-columns: repeat(7, minmax(0, 1fr)); }
  .grid.bodies { grid-template-columns: repeat(6, minmax(0, 1fr)); }
  .sheet .group { margin-top: 12px; }
  .cell { margin: 0; border: 2px solid var(--border); border-radius: 16px; padding: 16px 12px 14px; display: grid; grid-template-rows: auto 1fr; justify-items: center; align-items: start; gap: 10px; }
  .cell figcaption { display: grid; align-content: start; gap: 2px; text-align: center; }
  .cell strong { font-weight: 800; display: inline-flex; align-items: center; justify-content: center; gap: 6px; }
  .cell span:not(.dot) { font-size: 13px; line-height: 18px; color: var(--muted-fg); }

  @media (max-width: 1020px) { .grid.faces { grid-template-columns: repeat(4, minmax(0, 1fr)); } .grid.bodies { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
  @media (max-width: 760px) {
    .stage-wrap { grid-template-columns: 1fr; }
    .stage { min-height: 340px; }
  }
  @media (max-width: 520px) { .moods, .grid.faces, .grid.bodies { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
</style>
<div id="root"></div>
<script src="app.js"></script>
