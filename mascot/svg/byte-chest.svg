<svg xmlns="http://www.w3.org/2000/svg" viewBox="-40 -40 280 260" aria-hidden="true"><style>
  .byte-twinkle { transform-box: fill-box; transform-origin: center; animation: byte-twinkle 1.6s ease-in-out infinite }
  @keyframes byte-twinkle { 0%,100% { transform: scale(1) rotate(0) } 50% { transform: scale(.7) rotate(20deg) } }
  .byte-float { animation: byte-float 2.4s ease-in-out infinite }
  @keyframes byte-float { 0%,100% { transform: translateY(0) } 50% { transform: translateY(-4px) } }
  .byte-smoke { animation: byte-smoke 1.8s ease-out infinite }
  @keyframes byte-smoke { 0% { opacity: 0; transform: translateY(6px) } 25% { opacity: 1 } 100% { opacity: 0; transform: translateY(-10px) } }
  .byte-tear { animation: byte-tear 1.8s ease-in infinite }
  .byte-tear + .byte-tear { animation-delay: .6s }
  @keyframes byte-tear { 0% { opacity: 0; transform: translateY(0) } 15% { opacity: 1; transform: translateY(2px) }
    80% { opacity: 1; transform: translateY(14px) } 100% { opacity: 0; transform: translateY(18px) } }
  @media (prefers-reduced-motion: reduce) {
    .byte-twinkle, .byte-float, .byte-smoke, .byte-tear { animation: none }
    .byte-tear { transform: translateY(2px) }
  }
</style><defs><clipPath id="eyeL-R0"><rect x="60" y="66" width="38" height="50" rx="19"></rect></clipPath><clipPath id="eyeR-R0"><rect x="102" y="66" width="38" height="50" rx="19"></rect></clipPath></defs><path fill="#354254" d="M100 8 C122 8 140 28 150 56 C157 78 160 98 162 116 C176 138 180 166 174 182 C170 194 158 198 142 198 L58 198 C42 198 30 194 26 182 C20 166 24 138 38 116 C40 98 43 78 50 56 C60 28 78 8 100 8 Z"></path><path fill="#272C36" transform="translate(0 -7)" d="M100 154 C70 146 48 124 48 96 C48 66 70 45 100 45 C130 45 152 66 152 96 C152 124 130 146 100 154 Z"></path><path fill="#DEE1F9" d="M100 154 C70 146 48 124 48 96 C48 66 70 45 100 45 C130 45 152 66 152 96 C152 124 130 146 100 154 Z"></path><g fill="#BABEEC"><path d="M58 104 C60 124 94 128 98 112 C90 120 66 120 58 104 Z"></path><path d="M142 104 C140 124 106 128 102 112 C110 120 134 120 142 104 Z"></path></g><g><rect x="60" y="66" width="38" height="50" rx="19" fill="#FFFFFF"></rect><g clip-path="url(#eyeL-R0)"><g transform="translate(6 1) translate(79 93) scale(1) translate(-79 -93)"><rect x="71" y="81" width="16" height="24" rx="8" fill="#272C36"></rect><circle cx="76.5" cy="87" r="2.8" fill="#FFFFFF"></circle></g><rect x="44" y="116" width="70" height="70" fill="#DEE1F9"></rect><rect x="44" y="-4" width="70" height="70" fill="#BABEEC" transform="rotate(0 79 66)"></rect></g></g><g><rect x="102" y="66" width="38" height="50" rx="19" fill="#FFFFFF"></rect><g clip-path="url(#eyeR-R0)"><g transform="translate(-6 1) translate(121 93) scale(1) translate(-121 -93)"><rect x="113" y="81" width="16" height="24" rx="8" fill="#272C36"></rect><circle cx="118.5" cy="87" r="2.8" fill="#FFFFFF"></circle></g><rect x="86" y="116" width="70" height="70" fill="#DEE1F9"></rect><rect x="86" y="-4" width="70" height="70" fill="#BABEEC" transform="rotate(0 121 66)"></rect></g></g><g transform="translate(0 116) scale(1 2) translate(0 -116)"><path d="M91 116 L109 116 L105 124 C103 126 97 126 95 124 Z" fill="#272C36"></p